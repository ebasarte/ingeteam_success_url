<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <title>Pago realizado correctamente</title>
    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #f4f9f4;
            color: #333;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        img.svg-img {
           width: 50px; 
           height: auto; /* Mantener la proporción de aspecto */
        }
        
        h1 {
            margin: 0 0 18px;
            color: #2e7d32;
            font-size: clamp(24px, 7vw, 30px);
            font-weight: 700;
            line-height: 1.25;
        }
        
        /* Ajustes específicos para móviles */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
        
            .container {
                padding: 30px 20px;
            }
        
            h1 {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="svg-img" src="ok.svg" alt="ok_mark">
        <h1 id="description"></h1>
    </div>
    <script>
      const texts = {
        'es': { title: 'Pago realizado correctamente', description: 'Tu transacción se ha completado con éxito' },
        'en': { title: 'Payment made correctly', description: 'Your transaction has been completed successfully' },
        'fr': { title: 'Paiement effectué correctement', description: 'Votre transaction a été effectuée avec succès' }
      };
      const userLang = navigator.language || navigator.languages[0];
      const langCode = userLang.split('-')[0];
      const selectedTexts = texts[langCode] || texts['en'];
      document.title = selectedTexts.title;
      document.getElementById('description').textContent = selectedTexts.description;
    </script>
</body>
</html>
