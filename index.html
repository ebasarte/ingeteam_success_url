<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <title>Pago realizado correctamente</title>
    <style>

        * {
            box-sizing: border-box;
        }
        
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            min-height: 100dvh;
            padding: 15px;
            font-family: "Inter", sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        
        .container {
            width: 100%;
            text-align: center;
        }

        img.svg-img {
            display: block;
            width: clamp(100px, 30vw, 160px);
            height: auto;
            margin: 0 auto;
            object-fit: contain;
        }
    
        h1 {
            width: min(658px, 100%);
            margin: clamp(30px, 4vh, 77px) auto 0;
            font-family: "Inter", sans-serif;
            font-size: clamp(42px, 9vw, 90px);
            color: #000000;
            text-align: center;
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: 0;
        }

        @media (max-width: 768px) {
            html,
            body {
                overflow: hidden;
                height: 100%;
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <img class="svg-img" src="ok.svg" alt="Operacion realizada correctamente">
        <h1 id="description"></h1>
    </div>
    <script>
      const texts = {
        'es': { title: 'Pago realizado correctamente', description: 'Pago realizado' },
        'en': { title: 'Payment made correctly', description: 'Payment successful' },
        'fr': { title: 'Paiement effectué correctement', description: 'Paiement effectué' }
      };
      const userLang = navigator.language || navigator.languages[0];
      const langCode = userLang.split('-')[0];
      const selectedTexts = texts[langCode] || texts['en'];
      document.title = selectedTexts.title;
      document.getElementById('description').textContent = selectedTexts.description;
    </script>
</body>
</html>
